name: Scrape IT Jobs & Update Database

on:
  schedule:
    # Daily at 6 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'

  # Manual trigger from Actions tab
  workflow_dispatch:

  # Run when scraper or workflow changes
  push:
    branches:
      - main
    paths:
      - 'job-scraper.js'
      - '.github/workflows/scrape-jobs.yml'

jobs:
  scrape-jobs:
    name: Scrape and Validate Jobs
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Job Scraper
        env:
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NODE_ENV: production
        run: |
          echo "🔍 Starting job scraper..."
          node job-scraper.js "software engineer"
          echo "✅ Scraping completed"

          if [ -f "jobs.json" ]; then
            echo "✅ jobs.json created"
            echo "📊 Job count: $(jq '.summary.total' jobs.json)"
            echo "✅ Verified:  $(jq '.summary.verified' jobs.json)"
            echo "⚠️  Suspicious: $(jq '.summary.suspicious' jobs.json)"
            echo "🔁 Duplicates: $(jq '.summary.duplicates' jobs.json)"
          else
            echo "❌ jobs.json was NOT created — check scraper logs above"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Job Scraper Bot"

      - name: Commit jobs.json
        run: |
          git add jobs.json

          if git diff --cached --quiet; then
            echo "✅ No changes to commit (jobs unchanged)"
          else
            TOTAL=$(jq '.summary.total' jobs.json)
            VERIFIED=$(jq '.summary.verified' jobs.json)
            SUSPICIOUS=$(jq '.summary.suspicious' jobs.json)
            DUPES=$(jq '.summary.duplicates' jobs.json)

            git commit -m "🤖 Jobs update $(date +'%Y-%m-%d') — Total:$TOTAL Verified:$VERIFIED Suspicious:$SUSPICIOUS Dupes:$DUPES"
            git push origin main
            echo "✅ jobs.json pushed"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## 📊 Scraping Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "jobs.json" ]; then
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Jobs | $(jq '.summary.total' jobs.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Verified ✓ | $(jq '.summary.verified' jobs.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Suspicious ⚠️ | $(jq '.summary.suspicious' jobs.json) |" >> $GITHUB_STEP_SUMMARY
            echo "| Duplicates 🔁 | $(jq '.summary.duplicates' jobs.json) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Sources:**" >> $GITHUB_STEP_SUMMARY
            echo "- RemoteOK: $(jq '.summary.bySource.remoteok' jobs.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Arbeitnow: $(jq '.summary.bySource.arbeitnow' jobs.json)" >> $GITHUB_STEP_SUMMARY
            echo "- The Muse: $(jq '.summary.bySource.muse' jobs.json)" >> $GITHUB_STEP_SUMMARY
            echo "- Adzuna India: $(jq '.summary.bySource.adzuna' jobs.json)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Last Updated:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          fi

  # Optional Slack notification — only runs if SLACK_WEBHOOK_URL secret is set
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: scrape-jobs
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "IT Job Agent — Scrape ${{ needs.scrape-jobs.result }} on ${{ github.ref_name }}"
            }
        continue-on-error: true
